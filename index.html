<!DOCTYPE html>
<html lang="no">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Norge Dating — Lokale singler</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; -webkit-tap-highlight-color: transparent; }
    body { background: #0f172a; color: #f8fafc; min-height: 100dvh; display: flex; flex-direction: column; align-items: center; justify-content: space-between; padding: 16px 14px; overflow: hidden; }

    /* Шапка */
    .header { width: 100%; max-width: 400px; display: flex; align-items: center; justify-content: space-between; background: rgba(30, 41, 59, 0.8); backdrop-filter: blur(10px); padding: 10px 16px; border-radius: 16px; border: 1px solid rgba(255, 255, 255, 0.08); }
    .logo { font-weight: 800; font-size: 16px; color: #fff; display: flex; align-items: center; gap: 6px; }
    .logo span { color: #f43f5e; }
    .live-badge { display: flex; align-items: center; gap: 6px; font-size: 12px; font-weight: 600; color: #22c55e; background: rgba(34, 197, 94, 0.12); padding: 4px 10px; border-radius: 20px; }
    .dot { width: 8px; height: 8px; background: #22c55e; border-radius: 50%; animation: pulseDot 1.5s infinite; }

    /* Карточка свайпа */
    .card-container { width: 100%; max-width: 400px; flex: 1; display: flex; flex-direction: column; justify-content: center; margin: 12px 0; position: relative; }
    .swipe-card { width: 100%; height: 62dvh; max-height: 480px; background: #1e293b; border-radius: 24px; overflow: hidden; position: relative; box-shadow: 0 10px 30px rgba(0,0,0,0.5); border: 1px solid rgba(255,255,255,0.08); cursor: pointer; transition: transform 0.3s ease; }
    .swipe-card:active { transform: scale(0.99); }
    
    .card-img { width: 100%; height: 100%; object-fit: cover; }
    .card-gradient { position: absolute; inset: 0; background: linear-gradient(180deg, transparent 40%, rgba(15,23,42,0.85) 75%, rgba(15,23,42,0.98) 100%); }

    .card-info { position: absolute; bottom: 16px; left: 16px; right: 16px; z-index: 2; }
    .name-row { font-size: 22px; font-weight: 700; color: #fff; display: flex; align-items: center; justify-content: space-between; }
    .distance { font-size: 13px; font-weight: 500; color: #cbd5e1; background: rgba(255,255,255,0.15); backdrop-filter: blur(5px); padding: 3px 10px; border-radius: 12px; }
    .status-text { font-size: 13.5px; color: #f43f5e; margin-top: 4px; font-weight: 600; }
    .bio { font-size: 13px; color: #94a3b8; margin-top: 4px; }

    /* Кнопки управления (Tinder-style) */
    .actions { width: 100%; max-width: 400px; display: flex; align-items: center; justify-content: center; gap: 24px; padding-bottom: 10px; }
    .action-btn { width: 64px; height: 64px; border-radius: 50%; border: none; display: flex; align-items: center; justify-content: center; font-size: 24px; cursor: pointer; box-shadow: 0 4px 15px rgba(0,0,0,0.3); transition: transform 0.2s; }
    .action-btn:active { transform: scale(0.9); }
    .btn-pass { background: #1e293b; color: #94a3b8; border: 1px solid rgba(255,255,255,0.1); }
    .btn-like { background: linear-gradient(135deg, #f43f5e, #fb7185); color: #fff; width: 72px; height: 72px; font-size: 28px; animation: btnPulse 1.8s infinite; }

    .footer-note { font-size: 11px; color: #64748b; text-align: center; }

    @keyframes pulseDot { 0%, 100% { opacity: 1; } 50% { opacity: 0.3; } }
    @keyframes btnPulse { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.06); } }
  </style>
</head>
<body>

  <div class="header">
    <div class="logo">Norge<span>Match</span></div>
    <div class="live-badge">
      <div class="dot"></div>
      <span>Online (~3.2 km)</span>
    </div>
  </div>

  <div class="card-container">
    <div class="swipe-card" onclick="goOffer()">
      <img id="profileImg" class="card-img" src="" alt="Ingrid">
      <div class="card-gradient"></div>
      <div class="card-info">
        <div class="name-row">
          <span id="profileName">Ingrid, 25</span>
          <span class="distance">📍 2.1 km</span>
        </div>
        <div class="status-text" id="profileStatus">🔥 Vil møте i dag (Vil møtes)</div>
        <div class="bio" id="profileBio">«Bodd i Oslo hele livet. Søker en snill mann...»</div>
      </div>
    </div>
  </div>

  <div class="actions">
    <button class="action-btn btn-pass" onclick="nextProfile()">✕</button>
    <button class="action-btn btn-like" onclick="goOffer()">❤️</button>
  </div>

  <div class="footer-note">18+ · Verifiserte profiler i Norge · Konfidensielt</div>

  <script>
    // Твоя ссылка Traforce под Норвегию
    const OFFER_URL = "https://nord.affpmelody.com/EEKLY7";

    // База скандинавских анкет для ротации при свайпе "Пропустить"
    const profiles = [
      { name: "Ingrid, 25", dist: "📍 2.1 km", status: "🔥 Vil møtes i dag", bio: "«Bodd i Oslo. Søker en snill mann...»", img: "https://images.unsplash.com/photo-1529626455594-4ff0802cfb7e?w=600&auto=format&fit=crop&q=80" },
      { name: "Astrid, 28", dist: "📍 1.5 km", status: "💬 Online nå", bio: "«Elsker fjellturer og kos hjemme...»", img: "https://images.unsplash.com/photo-1517841905240-472988babdf9?w=600&auto=format&fit=crop&q=80" },
      { name: "Silje, 24", dist: "📍 3.4 km", status: "❤️ Match-garanti", bio: "«Vil bli kjent med nye mennesker her.»", img: "https://images.unsplash.com/photo-1494790108377-be9c29b29330?w=600&auto=format&fit=crop&q=80" }
    ];

    let currentIndex = 0;

    function updateProfile() {
      const p = profiles[currentIndex];
      document.getElementById('profileName').innerText = p.name;
      document.getElementById('profileStatus').innerText = p.status;
      document.getElementById('profileBio').innerText = p.bio;
      document.getElementById('profileImg').src = p.img;
    }

    // При нажатии крестика ("Пропустить") анкета меняется на следующую, а на 2-й или 3-й раз уводит на оффер
    function nextProfile() {
      if (navigator.vibrate) navigator.vibrate(40);
      currentIndex++;
      if (currentIndex >= profiles.length) {
        goOffer(); // Сразу на оффер после просмотра вариантов
      } else {
        updateProfile();
      }
    }

    // Инициализация первой анкеты
    updateProfile();

    // Функция перехода на оффер с сохранением меток из Facebook
    function goOffer() {
      const params = window.location.search;
      window.location.href = OFFER_URL + (params ? (OFFER_URL.includes('?') ? '&' : '?') + params.substring(1) : "");
    }
  </script>
</body>
</html>
